[project]
name = "ytmeta"
version = "0.1.0"
description = "CLI tool and web app for viewing extensive YouTube video metadata"
requires-python = ">=3.9"
dependencies = [
    "yt-dlp",
    "rich",
    "flask",
]

[project.scripts]
ytmeta = "ytmeta.cli:main"

[tool.setuptools]
packages = ["ytmeta"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
