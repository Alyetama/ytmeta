<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 670" width="680" height="670">
  <defs>
    <style>
      text { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Menlo', monospace; }
      .bg { fill: #0d0d0f; }
      .bar { fill: #141416; }
      .dot-r { fill: #ef4444; }
      .dot-y { fill: #eab308; }
      .dot-g { fill: #22c55e; }
      .prompt { fill: #22c55e; }
      .url { fill: #eab308; }
      .dim { fill: #71717a; }
      .cyan { fill: #06b6d4; }
      .blue { fill: #3b82f6; }
      .green { fill: #22c55e; }
      .yellow { fill: #eab308; }
      .white { fill: #efeff1; }
      .panel-blue { fill: none; stroke: #3b82f6; stroke-width: 1; rx: 4; }
      .panel-green { fill: none; stroke: #22c55e; stroke-width: 1; rx: 4; }
      .panel-yellow { fill: none; stroke: #eab308; stroke-width: 1; rx: 4; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="680" height="670" rx="8"/>

  <!-- Title bar -->
  <rect class="bar" x="0" y="0" width="680" height="36" rx="8"/>
  <rect class="bar" x="0" y="28" width="680" height="8"/>
  <circle class="dot-r" cx="20" cy="18" r="5"/>
  <circle class="dot-y" cx="38" cy="18" r="5"/>
  <circle class="dot-g" cx="56" cy="18" r="5"/>
  <text class="dim" x="80" y="22" font-size="11">terminal</text>

  <!-- Command line -->
  <text class="prompt" x="16" y="64" font-size="13">$</text>
  <g>
    <text class="white" x="30" y="64" font-size="13">ytmeta </text>
    <text class="url" x="82" y="64" font-size="13">https://www.youtube.com/watch?v=dQw4w9WgXcQ</text>
    <rect fill="#efeff1" x="424" y="53" width="7" height="14">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
  </g>

  <!-- Fetching line -->
  <text class="dim" x="16" y="90" font-size="11" opacity="0">
    Fetching metadata for https://www.youtube.com/watch?v=dQw4w9WgXcQ...
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.9s" fill="freeze"/>
  </text>

  <!-- Header line -->
  <text class="dim" x="16" y="114" font-size="11" opacity="0">
    ytmeta    Rick Astley - Never Gonna Give You Up (Official Video) (4K Remaster)
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.2s" fill="freeze"/>
  </text>

  <!-- Overview panel -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.7s" fill="freeze"/>
    <rect class="panel-blue" x="14" y="130" width="652" height="118"/>
    <text class="blue" x="30" y="148" font-size="10" font-weight="bold">Overview</text>
    <text class="dim" x="30" y="168" font-size="11">Channel</text>
    <text class="white" x="160" y="168" font-size="11">Rick Astley</text>
    <text class="dim" x="30" y="186" font-size="11">Upload Date</text>
    <text class="white" x="160" y="186" font-size="11">October 25, 2009</text>
    <text class="dim" x="30" y="204" font-size="11">Duration</text>
    <text class="white" x="160" y="204" font-size="11">3m 33s</text>
    <text class="dim" x="30" y="222" font-size="11">Category</text>
    <text class="white" x="160" y="222" font-size="11">N/A</text>
    <text class="dim" x="30" y="240" font-size="11">Video ID</text>
    <text class="white" x="160" y="240" font-size="11">dQw4w9WgXcQ</text>
  </g>

  <!-- Statistics panel -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.4s" fill="freeze"/>
    <rect class="panel-green" x="14" y="262" width="652" height="82"/>
    <text class="green" x="30" y="280" font-size="10" font-weight="bold">Statistics</text>
    <text class="dim" x="30" y="300" font-size="11">Views</text>
    <text class="white" x="160" y="300" font-size="11">1797.5M</text>
    <text class="dim" x="30" y="318" font-size="11">Likes</text>
    <text class="white" x="160" y="318" font-size="11">19.3M</text>
    <text class="dim" x="30" y="336" font-size="11">Comments</text>
    <text class="white" x="160" y="336" font-size="11">2.4M</text>
  </g>

  <!-- Technical Details panel -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.1s" fill="freeze"/>
    <rect class="panel-yellow" x="14" y="358" width="652" height="262"/>
    <text class="yellow" x="30" y="376" font-size="10" font-weight="bold">Technical Details</text>
    <text class="dim" x="30" y="396" font-size="11">Est. Watch Hours</text>
    <text class="white" x="160" y="396" font-size="11">106,354,952</text>
    <text class="dim" x="30" y="414" font-size="11">Resolution</text>
    <text class="white" x="160" y="414" font-size="11">3840x2160</text>
    <text class="dim" x="30" y="432" font-size="11">FPS</text>
    <text class="white" x="160" y="432" font-size="11">25</text>
    <text class="dim" x="30" y="450" font-size="11">Format</text>
    <text class="white" x="160" y="450" font-size="11">401 - 3840x2160 (2160p)+251 - audio o...</text>
    <text class="dim" x="30" y="468" font-size="11">Video Codec</text>
    <text class="white" x="160" y="468" font-size="11">av01.0.12M.08</text>
    <text class="dim" x="30" y="486" font-size="11">Audio Codec</text>
    <text class="white" x="160" y="486" font-size="11">opus</text>
    <text class="dim" x="30" y="504" font-size="11">Total Bitrate</text>
    <text class="white" x="160" y="504" font-size="11">9154 kbps</text>
    <text class="dim" x="30" y="522" font-size="11">Video Bitrate</text>
    <text class="white" x="160" y="522" font-size="11">9025 kbps</text>
    <text class="dim" x="30" y="540" font-size="11">Audio Bitrate</text>
    <text class="white" x="160" y="540" font-size="11">129 kbps</text>
    <text class="dim" x="30" y="558" font-size="11">File Size</text>
    <text class="white" x="160" y="558" font-size="11">232.5 MB</text>
    <text class="dim" x="30" y="576" font-size="11">Has Subtitles</text>
    <text class="white" x="160" y="576" font-size="11">Yes</text>
    <text class="dim" x="30" y="594" font-size="11">Has Chapters</text>
    <text class="white" x="160" y="594" font-size="11">No</text>
  </g>

  <!-- Abridgement note -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.8s" fill="freeze"/>
    <text class="dim" x="16" y="640" font-size="10">Abridged. The full run also prints Availability, Subtitles &amp; Captions, URLs,</text>
    <text class="dim" x="16" y="656" font-size="10">and an Available Formats table, then a "Fetched at ..." footer. Captured 2026-07-28.</text>
  </g>

</svg>
